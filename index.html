<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Capital Explorer</title>
    
    <!-- jsVectorMap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --capital-color: #f43f5e; /* Custom Color for Capital */
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            margin-top: 5vh;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 18px;
            font-weight: 300;
            margin: 0;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95%;
            max-width: 1200px;
            margin-top: 40px;
            gap: 30px;
        }

        .map-wrapper {
            width: 100%;
            height: 55vh;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(20px);
            position: relative;
        }

        #world-map {
            width: 100%;
            height: 100%;
        }

        .info-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-panel:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(244, 63, 94, 0.1);
        }

        .country-name {
            font-size: 20px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
        }

        /* 
           REQUESTED CSS:
           Custom properties for the font of the capital (color, bold, font size) 
        */
        .capital-name {
            color: var(--capital-color);  /* Custom Color */
            font-weight: 800;             /* Bold */
            font-size: 38px;              /* Font Size */
            margin: 0;
            text-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            line-height: 1.2;
        }

        .placeholder {
            color: #64748b;
            font-style: italic;
            font-size: 18px;
            font-weight: 300;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent);
            font-size: 18px;
            font-weight: 500;
            pointer-events: none;
        }

        /* jsVectorMap tooltip styling */
        .jvm-tooltip {
            font-family: 'Outfit', sans-serif;
            background-color: rgba(15, 23, 42, 0.9);
            color: white;
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-transition {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Global Capital Explorer</h1>
        <p class="subtitle">Hover and click on any country on the map to discover its capital</p>
    </div>

        <div class="map-wrapper">
            <div id="loading-indicator" class="loading">Loading Map Data...</div>
            <div id="world-map"></div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="country-name fade-transition" id="countryDisplay">World</div>
            <div id="capitalDisplay" class="placeholder fade-transition">Select a country on the map</div>
        </div>
    </div>

    <!-- jsVectorMap Core and World Map Data -->

            // Initialize Map
            const map = new jsVectorMap({
                selector: "#world-map",
                map: "world",
                backgroundColor: "transparent",
                zoomOnScroll: true,
                regionStyle: {
                    initial: {
                        fill: "#334155",
                        stroke: "#0f172a",
                        strokeWidth: 0.5,
                        fillOpacity: 1
                    },
                    hover: {
                        fill: "#38bdf8",
                        fillOpacity: 0.8,
                        cursor: 'pointer'
                    },
                    selected: {
                        fill: "#f43f5e"
                    }
                },
                onRegionTooltipShow(event, tooltip, code) {
                    const countryInfo = countriesData[code];
                    if (countryInfo) {
                        tooltip.text(countryInfo.name);
                    }
                },
                onRegionClick: function(event, code) {
                    const countryInfo = countriesData[code];
                    
                    if (countryInfo) {
                        const countryDisplay = document.getElementById("countryDisplay");
                        const capitalDisplay = document.getElementById("capitalDisplay");

                        // Fade out
                        countryDisplay.style.opacity = '0';
                        capitalDisplay.style.opacity = '0';
                        
                        setTimeout(() => {
                            // Update content
                            countryDisplay.textContent = countryInfo.name;
                            capitalDisplay.textContent = countryInfo.capital;
                            
                            // Apply the requested CSS class for styling the capital
                            capitalDisplay.className = "capital-name fade-transition"; 
                            
                            // Fade back in
                            countryDisplay.style.opacity = '1';
                            capitalDisplay.style.opacity = '1';
                        }, 300);
                    }
                }
